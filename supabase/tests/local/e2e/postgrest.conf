# PostgREST 12 for the local end-to-end database. The JWT secret is a throwaway value that
# gateway.cjs also uses to sign test sessions; never use it anywhere else.
db-uri = "postgres://authenticator:e2e-authenticator@localhost:5432/e2e"
db-schemas = "public"
db-anon-role = "anon"
jwt-secret = "e2e-local-jwt-secret-only-for-this-test-run-0123456789"
server-host = "127.0.0.1"
server-port = 54330
